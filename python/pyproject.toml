[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msgine"
version = "2.0.0"
description = "Official Python SDK for MsGine — SMS, Email, and Push Notifications API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kasim Lyee", email = "lyee@codewithlyee.com" }]
keywords = ["msgine", "sms", "email", "push", "messaging", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.28", "ruff>=0.1", "mypy>=1.0"]

[project.urls]
Homepage = "https://msgine.net"
Repository = "https://github.com/kasimlyee/msgine-sdk"
Issues = "https://github.com/kasimlyee/msgine-sdk/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.9"
